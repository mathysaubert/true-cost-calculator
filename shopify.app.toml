# Learn more about configuring your app at https://shopify.dev/docs/tools/cli/configuration

client_id = "86fd438b41780fea017016e42158aedf"
name = "true-cost-calculator"
application_url = "https://true-cost-calculator-silk.vercel.app"
embedded = true

[access_scopes]
# Minimal scopes — read-only access to products and inventory
scopes = "read_products,read_inventory"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[auth]
redirect_urls = [ "https://true-cost-calculator-silk.vercel.app/api/auth" ]

[build]
automatically_update_urls_on_dev = false
